[project]
name = "invisible-dots-engine"
version = "0.1.0"
description = "The invisible_dots engine: a hard fork of nanobot"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Xubin Ren"},
    {name = "the nanobot contributors"}
]
keywords = ["ai", "agent", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
]

dependencies = [
    "pydantic>=2.12.0,<3.0.0",
    "aiohttp>=3.14.3,<4.0.0",
    "httpx[socks]>=0.28.0,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "croniter>=6.0.0,<7.0.0",
    "mcp>=1.26.0,<2.0.0",
    "json-repair>=0.57.0,<1.0.0",
    "openai>=2.8.0",
    "tiktoken>=0.12.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "rapidfuzz>=3.14.6,<4.0.0",
    "filelock>=3.25.2",
    # No module imports it: zoneinfo falls back to this package on a host without
    # an IANA timezone database (tests/test_dependencies.py names it).
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = [
    "nanobot/**/*.py",
    "nanobot/templates/**/*.md",
    "nanobot/**/*.json",
    "skills/*/SKILL.md",
]

[tool.hatch.build.targets.wheel]
packages = ["nanobot"]

[tool.hatch.build.targets.wheel.sources]
"nanobot" = "nanobot"

[tool.hatch.build.targets.sdist]
include = [
    "nanobot/",
    "skills/",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "UPSTREAM.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["limits(max_open, max_identities): the browser manager's limits for a test of the browser tools"]
